File clientExtensionsDir = file("client-extensions")

boolean deployEnvSet = findProperty("cx.custom.deploy.env") as boolean

boolean generateCXConfigRequested = gradle.startParameter.taskNames.any {
	it == "generateCXConfig" || it.endsWith(":generateCXConfig")
}

boolean onePerInstance = String.valueOf(findProperty("cx.custom.one-per-instance")) == "true"

subprojects { Project subproject ->
	if (!subproject.projectDir.toPath().startsWith(clientExtensionsDir.toPath()) ||
		!subproject.file("client-extension.yaml").exists()) {

		return
	}

	subproject.afterEvaluate {
		if (!subproject.pluginManager.hasPlugin("com.liferay.custom.cxconfig")) {
			subproject.pluginManager.apply("com.liferay.custom.cxconfig")
		}

		if (!deployEnvSet || generateCXConfigRequested) {
			return
		}

		String pluginId = onePerInstance ? "com.liferay.custom.cxperinstance" : "com.liferay.custom.cxmultiinstance"

		if (!subproject.pluginManager.hasPlugin(pluginId)) {
			subproject.pluginManager.apply(pluginId)
		}
	}
}
