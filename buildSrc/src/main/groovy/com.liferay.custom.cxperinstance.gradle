import com.liferay.custom.CXInstancesUtil

import groovy.json.JsonGenerator
import groovy.json.JsonSlurper

if (!tasks.names.contains("createClientExtensionConfig")) {
	throw new GradleException("Plugin com.liferay.custom.cxperinstance requires a client extension project: " + path)
}

def nestedWebId = findProperty("cx.internal.instance.web.id")

if (nestedWebId != null) {
	String bundleSafeName = gradle.liferayWorkspace.virtualInstanceId

	tasks.named("createClientExtensionConfig") {
		doLast {
			File configFile = clientExtensionConfigFile

			Map<String, Map> configurations = new JsonSlurper().parse(configFile)

			configurations.values().each { Map properties ->
				if (properties["dxp.lxc.liferay.com.virtualInstanceId"] == bundleSafeName) {
					properties["dxp.lxc.liferay.com.virtualInstanceId"] = String.valueOf(nestedWebId)
				}
			}

			configFile.setText(
				new JsonGenerator.Options().disableUnicodeEscaping().build().toJson(configurations), "UTF-8")
		}
	}

	return
}

String envName = String.valueOf(findProperty("cx.custom.deploy.env") ?: "").trim()

if (!envName) {
	throw new GradleException("cx.custom.one-per-instance requires -Pcx.custom.deploy.env=<env>")
}

def instancesValue = findProperty("cx.build.custom.env.instances[" + envName + "]")

if (instancesValue == null) {
	throw new GradleException(
		"No instances defined for cx.custom.deploy.env=" + envName + ". Add cx.build.custom.env.instances[" + envName +
			"]=... to gradle.properties")
}

if (gradle.liferayWorkspace.virtualInstanceId) {
	throw new GradleException(
		"liferay.virtual.instance.id=" + gradle.liferayWorkspace.virtualInstanceId +
			" is not compatible with cx.custom.one-per-instance")
}

List<String> webIds = CXInstancesUtil.parseWebIds(envName, instancesValue)

boolean includeDefault = webIds.contains("default")

List<String> extraWebIds = webIds - ["default"]

extraWebIds.each { CXInstancesUtil.validateForZipRegistration(it) }

List<String> supportedTaskNames = ["assemble", "build", "buildClientExtensionZip", "deploy"]

List<String> requestedTaskNames = gradle.startParameter.taskNames.collect {
	it.tokenize(":").last()
}.findAll {
	it in supportedTaskNames
}.unique()

if (requestedTaskNames.isEmpty()) {
	return
}

if (!includeDefault) {
	["buildClientExtensionZip", "deploy"].each { String taskName ->
		if (tasks.names.contains(taskName)) {
			tasks.named(taskName) {
				enabled = false
			}
		}
	}
}

Map<String, String> nestedProjectProperties = gradle.startParameter.projectProperties.findAll { key, value ->
	!key.startsWith("cx.custom.")
}

String projectPath = project.path
File workspaceDir = project.rootDir
File defaultZipFile = file("dist/" + project.name + ".zip")
boolean offline = gradle.startParameter.offline
boolean windows = System.getProperty("os.name").toLowerCase().contains("windows")

def perInstanceTask = tasks.register("cxPerInstance") {
	group = "liferay"
	description = "Runs " + requestedTaskNames + " once per virtual instance of " + envName + "."

	doLast {
		if (!includeDefault && defaultZipFile.exists()) {
			logger.lifecycle(
				"[cxperinstance] Removing {} because \"default\" is not in the instance list",
				project.relativePath(defaultZipFile))

			defaultZipFile.delete()
		}

		extraWebIds.each { String webId ->
			String bundleSafeName = CXInstancesUtil.toBundleSafeName(webId)

			logger.lifecycle(
				"[cxperinstance] {} {} -> {}{}", projectPath, requestedTaskNames, webId,
				bundleSafeName == webId ? "" : " (zip and bundle name: " + bundleSafeName + ")")

			List<String> command = [new File(workspaceDir, windows ? "gradlew.bat" : "gradlew").absolutePath]

			command.addAll(requestedTaskNames.collect { projectPath + ":" + it })

			nestedProjectProperties.each { key, value ->
				command << "-P" + key + "=" + value
			}

			command << "-Pliferay.virtual.instance.id=" + bundleSafeName

			if (bundleSafeName != webId) {
				command << "-Pcx.internal.instance.web.id=" + webId
			}

			if (offline) {
				command << "--offline"
			}

			project.exec {
				workingDir = workspaceDir
				commandLine = command
			}
		}
	}
}

requestedTaskNames.each { String taskName ->
	tasks.named(taskName) {
		finalizedBy perInstanceTask
	}
}
